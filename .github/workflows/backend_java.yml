name: backend-java-pipeline
run-name:
on:
  push:
    paths:
      - "Backend_Java/**"
    branches:
      - "develop"
      - "main"
jobs:
  backend_java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Login in DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend_Java
          file: Backend_Java/Dockerfile
          push: True
          tags: |
            yuriichechur/backend_java:${{github.run_number}} 
            yuriichechur/backend_java:latest
  deploy:
    runs-on: ubuntu-latest
    needs: backend_java

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to production via SSH
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "docker-compose.yml"
          target: /home/ubuntu/FinancialManager/production

      - name: Copy files to staging via SSH
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "docker-compose.yml"
          target: /home/ubuntu/FinancialManager/staging

      - name: Deploy to Production
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ubuntu/FinancialManager/production
            docker-compose pull backend
            docker-compose up backend --force-recreate -d

      - name: Deploy to Staging
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ubuntu/FinancialManager/staging
            docker-compose pull backend_java
            docker-compose up backend_java --force-recreate -d
