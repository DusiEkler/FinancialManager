name: frontend-pipeline
run-name:
on:
  push:
    paths:
      - "Frontend/**"
    branches:
      - "develop"
      - "main"
jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - name: Login in DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: Frontend/Dockerfile
          push: True
          tags: |
            yuriichechur/frontend:${{github.run_number}} 
            yuriichechur/frontend:latest
  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login in DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy to Production
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p /home/ubuntu/FinancialManager/production
          cp docker-compose.yml /home/ubuntu/FinancialManager/production/
          cd /home/ubuntu/FinancialManager/production
          docker-compose pull frontend
          docker-compose up frontend --force-recreate -d

      - name: Deploy to Staging
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          mkdir -p /home/ubuntu/FinancialManager/staging
          cp docker-compose.yml /home/ubuntu/FinancialManager/staging/
          cd /home/ubuntu/FinancialManager/staging
          docker-compose pull frontend
          docker-compose up frontend --force-recreate -d
